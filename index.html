<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safe Haven Quote">
<title>Custom Security System</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111;--muted:#666;--line:#e3e5e8;--accent:#1d6ef5;}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e22;--text:#f2f2f2;--muted:#9aa0a6;--line:#2c3036;}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px 16px calc(24px + env(safe-area-inset-bottom));}
h1{font-size:22px;margin:4px 0 16px}
h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
h2 span{color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}

.name{flex:1;min-width:0;font-size:15px}
.price{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:6px}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:40px;height:40px;font-size:20px;cursor:pointer}
button.plus{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.35}
.n{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{font:inherit;font-size:16px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.fields{display:flex;flex-wrap:wrap;gap:12px}.fields>div{flex:1 1 140px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font-size:15px;padding:0 14px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line)}td:not(:first-child){text-align:right}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.bar{margin-top:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;}
.bar .info{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
.bar .s{color:var(--muted);font-size:13px}
.bar .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .p{font-size:16px;font-weight:600}
.bar button{font-size:15px;padding:0 14px}
.section{margin-top:14px}
html{-webkit-text-size-adjust:100%}

/* larger sizing */
body{font-size:18px}
h1{font-size:30px}
h2{font-size:24px;margin-bottom:12px}
.card{padding:20px;border-radius:20px}
.items{grid-template-columns:repeat(2,1fr);gap:0 32px}
@media (max-width:600px){.items{grid-template-columns:1fr}}
.row{padding:26px 0;gap:12px;min-height:110px;box-sizing:border-box}
.name{font-size:21px}
.price{font-size:15px}
button{min-width:56px;height:56px;font-size:28px;border-radius:14px}
.n{min-width:40px;font-size:24px}
label{font-size:16px}
input{font-size:20px;padding:14px}
.seg button{font-size:18px;padding:0 18px;height:52px}
table{font-size:18px}td{padding:10px 0}
.bar .s{font-size:16px}.bar .t{font-size:32px}.bar .p{font-size:20px}.bar button{font-size:18px;height:52px}
.note{font-size:15px}

/* larger text v2 */
body{font-size:21px}
h1{font-size:36px}
h2{font-size:30px}
.name{font-size:26px}
.price{font-size:18px}
button{min-width:64px;height:64px;font-size:32px}
.n{min-width:48px;font-size:28px}
label{font-size:19px}
input{font-size:23px}
.seg button{font-size:21px;height:58px}
table{font-size:21px}
.bar .s{font-size:19px}.bar .t{font-size:38px}.bar .p{font-size:23px}.bar button{font-size:21px;height:58px}
.note{font-size:18px}
</style>
</head>
<body>
<h1>Custom Security System</h1>
<div class="grid" id="cats"></div>
<div class="grid section">
  <div class="card"><h2>Discount, voucher and activation fee</h2>
    <div class="fields">
      <div><label>Discount %</label><input id="disc" type="number" inputmode="decimal" min="0" max="100" placeholder="0"></div>
      <div><label>Voucher code</label><input id="vcode" placeholder="Optional"></div>
      <div><label>Voucher $ off</label><input id="vamt" type="number" inputmode="decimal" placeholder="0"></div>
      <div><label>Activation Fee</label><input id="afee" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
  </div>
  <div class="card"><h2>Sales tax</h2>
    <div class="seg" id="tax"></div>
  </div>
  <div class="card"><h2>Payment options</h2>
    <div class="seg" id="plans"></div>
    <table id="plantable" style="margin-top:10px"></table>
    <div class="note">Payments include the selected tax and are estimates; Synchrony's approved terms are final.</div>
  </div>
</div>
<div class="card section" id="summaryCard" style="display:none"><h2>Items on this quote</h2><table id="summary"></table></div>

<div class="bar">
  <div class="info" id="barinfo"></div>
  <button id="reset">New quote</button>
</div>

<script>
const CATS=[
 ["Security",[["dw","Door/Window sensor",125],["dwbogo","Door/Window sensor (BOGO)",125,1],["shock","Shock sensor",149],["shockup","Shock upgrade",50],["motion","Motion sensor",219],["glass","Glass break sensor",229]]],
 ["Life Safety",[["smoke","Smoke detector",229],["co","Carbon monoxide detector",219],["heat","Heat sensor",129]]],
 ["Video",[["outcam","Outdoor camera",349],["doorbell","Doorbell camera",349],["incam","Indoor camera",279]]],
 ["Automation",[["lock","Door lock",249],["garage","Garage controller",249],["thermo","Thermostat",249],["lamp","Lamp module",159]]],
 ["Remote Access",[["keypad","Secondary keypad",420],["fob","Keyfob",119]]],
 ["Custom Features",[["insiren","Indoor siren",129],["outsiren","Outdoor siren",299],["eero","Eero base Wi-Fi hub",159],["eeropro","Eero Pro Wi-Fi hub",250]]]
];
const PLANS=[["full","Pay in full"],["flex","Flex Pay (3 payments)"],["s36","Synchrony 36 mo, 0%"],["s25","Synchrony 25 mo, 0%"]];
const TAX=[["0","No tax"],["6.5","6.5%"],["7.5","7.5%"]];
let qty={},tax="6.5",plan="full";
const $=id=>document.getElementById(id);
const money=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const line=(it,q)=>(it[3]?Math.ceil(q/2):q)*it[2];
function buildCats(){
 $("cats").innerHTML=CATS.map(([c,items],ci)=>`<div class="card"><h2>${c}<span id="ct${ci}"></span></h2><div class="items">`+
  items.map(it=>`<div class="row"><div class="name">${it[1]}</div>
  <div class="qty"><button data-id="${it[0]}" data-d="-1" id="m_${it[0]}">−</button><span class="n" id="q_${it[0]}">0</span><button class="plus" data-id="${it[0]}" data-d="1">+</button></div></div>`).join("")+`</div></div>`).join("");
 $("cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id;qty[id]=Math.max(0,(qty[id]||0)+ +b.dataset.d);render();});
}
function seg(el,opts,get,set){$(el).innerHTML=opts.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("");
 $(el).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;set(b.dataset.v);render();});}
function render(){
 let sub=0,count=0,rows=[];
 CATS.forEach(([c,items],ci)=>{let ct=0;items.forEach(it=>{const q=qty[it[0]]||0;const lt=line(it,q);ct+=lt;sub+=lt;count+=q;
  $("q_"+it[0]).textContent=q;$("m_"+it[0]).disabled=!q;
  
  if(q)rows.push([it[1],q,money(it[2])+(it[3]?" BOGO":""),money(lt)]);});
  $("ct"+ci).textContent="";});
 const raw=parseFloat($("disc").value)||0;const pct=Math.min(100,Math.max(0,raw));const disc=sub*pct/100;
 const vcode=$("vcode").value.trim();const v=Math.min(Math.max(0,parseFloat($("vamt").value)||0),sub-disc);
 const fee=Math.max(0,parseFloat($("afee").value)||0);const after=sub-disc-v;const t=after*(+tax)/100;const total=after+t+fee;
 const pay={full:money(total),flex:"3 × "+money(total/3),s36:money(total/36)+"/mo × 36",s25:money(total/25)+"/mo × 25"};
 $("plantable").innerHTML=PLANS.map(([k,l])=>`<tr><td>${l}</td><td>${pay[k]}</td></tr>`).join("");
 document.querySelectorAll("#tax button").forEach(b=>b.classList.toggle("on",b.dataset.v===tax));
 document.querySelectorAll("#plans button").forEach(b=>b.classList.toggle("on",b.dataset.v===plan));
 const planLine={full:"",flex:"3 payments of "+money(total/3),s36:money(total/36)+"/mo for 36 months",s25:money(total/25)+"/mo for 25 months"}[plan];
 $("barinfo").innerHTML=`<span class="s">${count} devices</span><span class="s">Subtotal ${money(sub)}</span>`+
  (disc?`<span class="s">Discount ${pct}% −${money(disc)}</span>`:"")+(v?`<span class="s">Voucher${vcode?" "+vcode:""} −${money(v)}</span>`:"")+
  (t?`<span class="s">Tax ${tax}% ${money(t)}</span>`:"")+(fee?`<span class="s">Activation fee ${money(fee)}</span>`:"")+`<span class="t">Total ${money(total)}</span>`+(planLine?`<span class="p">${planLine}</span>`:"");
 if(rows.length){$("summaryCard").style.display="";
  let r=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("");
  $("summary").innerHTML=r;} else $("summaryCard").style.display="none";
}
buildCats();seg("tax",TAX,()=>tax,v=>tax=v);seg("plans",PLANS,()=>plan,v=>plan=v);
["disc","vcode","vamt","afee"].forEach(id=>$(id).addEventListener("input",render));
$("reset").onclick=()=>{qty={};["disc","vcode","vamt","afee"].forEach(id=>$(id).value="");plan="full";render();};
render();
</script>
</body>
</html>
